[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "One OpenAI-compatible endpoint in front of every model provider: routing, fallbacks, budgets, caching and a cost ledger."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "openai>=1.40"]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
