# Round-robin over the three gateway processes.
upstream gateways {
    server gateway-1:8000;
    server gateway-2:8000;
    server gateway-3:8000;
    keepalive 32;
}

server {
    listen 80;

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;                       # streamed answers go out as they arrive
        proxy_read_timeout 120s;
        add_header X-Upstream $upstream_addr always;   # which process answered, for demos and debugging
    }
}
