# List prices in USD per 1M tokens, used for cost ESTIMATES in the ledger and for budgets.
# Checked 2026-10-23. Verify against the providers' pricing pages before relying on them:
#   https://ai.google.dev/gemini-api/docs/pricing   https://aws.amazon.com/bedrock/pricing/
# Gemini bills thinking tokens as output; the Gemini adapter already counts them as output tokens.
free_providers: [fake, flaky, ollama]     # run locally: cost is recorded as 0
prices:
  gemini:
    gemini-2.5-flash: {input_per_mtok: 0.30, output_per_mtok: 2.50}
    gemini-2.5-flash-lite: {input_per_mtok: 0.10, output_per_mtok: 0.40}
  bedrock:
    us.amazon.nova-2-lite-v1:0: {input_per_mtok: 0.33, output_per_mtok: 2.75}
